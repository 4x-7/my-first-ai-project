<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 AI P 图工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>我的 AI P 图工具</h1>
      <p>第一版：上传图片、调整亮度/对比度/饱和度，然后下载。</p>
    </header>

    <section class="toolbar">
      <label class="upload">
        📷 上传图片
        <input id="fileInput" type="file" accept="image/*">
      </label>
      <button id="resetBtn" type="button">↺ 重置</button>
      <button id="downloadBtn" type="button" disabled>⬇ 下载图片</button>
    </section>

    <section class="workspace">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="emptyState">先点击“上传图片”</div>
      </div>

      <aside class="controls">
        <h2>调整</h2>
        <label>亮度 <span id="brightnessValue">100%</span>
          <input id="brightness" type="range" min="0" max="200" value="100">
        </label>
        <label>对比度 <span id="contrastValue">100%</span>
          <input id="contrast" type="range" min="0" max="200" value="100">
        </label>
        <label>饱和度 <span id="saturationValue">100%</span>
          <input id="saturation" type="range" min="0" max="200" value="100">
        </label>
      </aside>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
